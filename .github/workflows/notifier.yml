name: 📰 Hacker News AI Notifier (24/7 Free Cloud)

on:
  schedule:
    # Runs every 15 minutes 24/7 in GitHub Cloud for FREE
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Seen Stories Cache
        uses: actions/cache@v4
        with:
          path: seen_stories.json
          key: seen-stories-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            seen-stories-

      - name: Check Hacker News & Send Email Notification
        env:
          AGENTSCOUT_EMAIL_TO: ${{ secrets.AGENTSCOUT_EMAIL_TO }}
          AGENTSCOUT_SMTP_PASSWORD: ${{ secrets.AGENTSCOUT_SMTP_PASSWORD }}
        run: |
          python -c "import auto_notifier; auto_notifier.check_for_new_stories()"
